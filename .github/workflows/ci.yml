name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Nothing checked that the site still builds. It is the cheapest test this
      # repository has: a broken template or a malformed frontmatter block fails
      # here rather than on the deployed page.
      - name: Build
        run: npx eleventy

      - name: Checks
        run: node scripts/check.mjs

      # The author's writing rules (no em dashes, no banned words, no "not X but
      # Y" turns) are checked on the built pages. Quotations are exempt.
      - name: Copy standards
        run: node scripts/check-copy.mjs
